<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body data-page="works">

  <!-- 导航：由 data/site.js 渲染 -->

      <div class="section-head reveal" data-pagehead data-source="WORKS"></div>
    </div>
  </section>

  <!-- 音乐作品 -->
  <section class="section-alt">
    <div class="wrap">
      <div class="section-head reveal" data-heading="music" data-source="WORKS"></div>

      <h3 class="sub-title reveal" data-subtitle="albums" data-source="WORKS"></h3>
      <div class="grid grid-3" data-render="albums" data-source="WORKS"></div>

      <h3 class="sub-title reveal" data-subtitle="ost" data-source="WORKS"></h3>
      <div class="grid grid-3" data-render="ost" data-source="WORKS"></div>

    <div class="wrap">
      <div class="section-head reveal" data-heading="film" data-source="WORKS"></div>
      <div class="grid grid-3" data-render="films" data-source="WORKS"></div>

  <!-- 影视作品 -->

      <div class="grid grid-3" data-render="dramas" data-source="WORKS"></div>

      <div class="section-head reveal" data-heading="variety" data-source="WORKS"></div>
      <div class="grid grid-3" data-render="variety" data-source="WORKS"></div>

  <!-- 待播 / 拍摄中 -->
  <section class="section-alt">
    <div class="wrap">
      <div class="section-head reveal" data-heading="upcoming" data-source="WORKS"></div>
      <div class="grid grid-2" data-render="upcoming" data-source="WORKS"></div>
    </div>
  </section>

  <!-- 合规声明 -->

    <div class="wrap" data-site-notice></div>
  </section>

  <!-- 页脚：由 data/site.js 渲染 -->

  <script src="data/site.js"></script>
