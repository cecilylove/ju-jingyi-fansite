<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图库 · 鞠婧祎 · 橘光集</title>
  <meta name="description" content="橘光集 · 鞠婧祎写真与舞台图库（图源：微博 @鞠婧祎，仅供非商业纪念用途）。" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="gallery">

  <!-- 导航：由 data/site.js 渲染 -->
  <header class="nav" data-site-nav></header>

  <section style="padding-top:calc(var(--nav-h) + 70px)">
    <div class="wrap">
      <div class="section-head reveal" data-pagehead data-source="GALLERY"></div>
      <div class="gallery-grid" data-render-gallery></div>
    </div>
  </section>

  <!-- 图片版权说明 -->
  <section class="section-alt">
    <div class="wrap" data-site-notice="image"></div>
  </section>

  <!-- 页脚：由 data/site.js 渲染 -->
  <footer class="footer" data-site-footer></footer>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" aria-hidden="true" inert>
    <h2 class="sr-only" id="lightbox-title">图片预览</h2>
    <button class="lb-close" type="button" aria-label="关闭图片预览">&times;</button>
    <div class="lb-inner"></div>
  </div>

  <script src="data/site.js"></script>
  <script src="data/gallery.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
