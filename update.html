<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动态详情 · 橘光集</title>
  <meta name="description" content="橘光集 · 鞠婧祎近期动态详情。" />

  <!-- 图标与社交分享卡片 -->
  <!-- ⚠️ 本页正文由 ?id= 参数动态渲染，而社交平台爬虫不执行 JS，
       所以 og:title / og:description 只能写通用文案（无法按单篇文章定制）。
       ⚠️ 绑定自定义域名后，把 og:image 改成绝对地址。 -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#2F6DB0" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="橘光集 · Orange Light" />
  <meta property="og:title" content="动态详情 · 橘光集" />
  <meta property="og:description" content="橘光集 · 鞠婧祎近期动态详情。" />
  <meta property="og:image" content="assets/img/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="918" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="news">

  <!-- 导航：由 data/site.js 渲染 -->
  <header class="nav" data-site-nav></header>

  <!--
    详情页正文整块由 assets/js/main.js 的「动态详情页渲染器」生成。
    内容来自 data/news.js 的 articles，按网址参数 ?id=xxx 取对应那篇。

    加一条新动态：只在 data/news.js 的 articles 数组里加一项，不用动这个文件。
  -->
  <main class="update-detail" data-update-root></main>

  <!-- 页脚：由 data/site.js 渲染 -->
  <footer class="footer" data-site-footer></footer>

  <script src="data/site.js"></script>
  <script src="data/news.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
