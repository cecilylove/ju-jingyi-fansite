<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>橘光集 · 鞠婧祎非官方粉丝纪念站</title>
  <meta name="description" content="橘光集（Orange Light）—— 鞠婧祎非官方粉丝纪念站，由粉丝自发搭建，收录音乐、影视作品与图库（资料参考百度百科）。" />

  <!-- 图标与社交分享卡片 -->
  <!-- ⚠️ 绑定自定义域名后，把 og:image 改成绝对地址（https://你的域名/assets/img/og-cover.jpg） -->
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#2F6DB0" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="橘光集 · Orange Light" />
  <meta property="og:title" content="橘光集 · 鞠婧祎非官方粉丝纪念站" />
  <meta property="og:description" content="由粉丝自发搭建的鞠婧祎非官方纪念站，收录音乐、影视作品与图库。" />
  <meta property="og:image" content="assets/img/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="918" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="home-page" data-page="index">
  <noscript>
    <div style="max-width:640px;margin:72px auto;padding:0 24px;font:16px/1.9 system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#2b3138">
      <h1 style="font-family:Georgia,'Songti SC',serif;font-size:24px;letter-spacing:2px;margin:0 0 14px">橘光集<span style="font-size:13px;letter-spacing:1px;color:#8a939d;margin-left:8px">ORANGE LIGHT</span></h1>
      <p style="margin:0 0 10px">本站内容由脚本渲染，需要浏览器开启 JavaScript 才能显示。</p>
      <p style="margin:0">请在浏览器设置中启用 JavaScript 后刷新页面。</p>
      <p style="margin:22px 0 0">
        <a href="index.html" style="color:#c4622d">首页</a> ·
        <a href="about.html" style="color:#c4622d">关于她</a> ·
        <a href="works.html" style="color:#c4622d">作品</a> ·
        <a href="gallery.html" style="color:#c4622d">图库</a> ·
        <a href="news.html" style="color:#c4622d">动态</a>
      </p>
      <p style="margin:26px 0 0;font-size:13px;color:#8a939d">非官方粉丝站 · 图源：微博 @鞠婧祎 · 仅供非商业纪念用途</p>
    </div>
  </noscript>

  <!-- 导航：由 data/site.js 渲染 -->
  <header class="nav" data-site-nav></header>

  <!-- 人物首屏 -->
  <section class="home-hero">
    <img class="home-hero-media" data-home-hero="image" src="assets/img/feature-music.jpg" alt="鞠婧祎舞台造型" />
    <div class="home-hero-overlay"></div>
    <div class="wrap">
      <div class="home-hero-copy">
        <span class="home-eyebrow" data-home-hero="eyebrow"></span>
        <h1 data-home-hero="title"></h1>
        <p class="home-hero-lead" data-home-hero="lead"></p>
        <p class="home-hero-note" data-home-hero="note"></p>
        <div class="home-hero-actions" data-render-home="heroActions"></div>
      </div>
    </div>
    <a class="home-scroll" href="#fandom">向下探索<span aria-hidden="true"></span></a>
  </section>

  <!-- 应援档案信息带 -->
  <section class="home-fandom" id="fandom">
    <div class="wrap">
      <div class="home-fandom-strip">
        <div class="home-fandom-intro" data-render-home="fandomIntro"></div>
        <div data-render-home="fandom" style="display:contents"></div>
      </div>
    </div>
  </section>

  <!-- 近期动态 -->
  <section class="home-focus" id="updates">
    <div class="wrap">
      <div class="home-section-heading" data-heading="updates" data-source="HOME"></div>
      <!-- 近期动态：从 data/news.js 的 NEWS.articles 截取前 2 条（唯一源头） -->
      <div class="home-focus-grid" data-render-home="updates" data-limit="2"></div>
    </div>
  </section>

  <!-- 关于她 -->
  <section class="home-about section-alt">
    <div class="wrap">
      <div class="home-about-layout" data-render-home="about"></div>
    </div>
  </section>

  <!-- 代表作品 -->
  <section class="home-works">
    <div class="wrap">
      <div class="home-section-heading reveal" data-heading="works" data-source="HOME"></div>
      <div class="home-work-grid" data-render-home="workCards"></div>
    </div>
  </section>

  <!-- 精选图库 -->
  <section class="home-gallery section-alt">
    <div class="wrap">
      <div class="home-section-heading reveal" data-heading="gallery" data-source="HOME"></div>
      <div class="home-gallery-grid" data-render-home="galleryPreview"></div>
      <div class="home-center-action reveal" data-render-home="galleryPreviewButton"></div>
    </div>
  </section>

  <!-- 精简里程碑 -->
  <section class="home-milestones">
    <div class="wrap">
      <div class="home-section-heading reveal" data-heading="milestones" data-source="HOME"></div>
      <!-- 成长里程碑：从全站共用的 SITE.milestones 截取前 4 条（数据在 data/site.js） -->
      <div class="home-milestone-grid" data-render-home="milestones" data-limit="4"></div>
    </div>
  </section>

  <!-- 合规声明 -->
  <section class="section-alt home-disclaimer">
    <div class="wrap" data-site-notice></div>
  </section>

  <!-- 页脚：由 data/site.js 渲染 -->
  <footer class="footer" data-site-footer></footer>

  <script src="data/site.js"></script>
  <script src="data/home.js"></script>
  <!-- 首页「近期动态」读动态页的文章数据，所以这里也要引 news.js -->
  <script src="data/news.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
